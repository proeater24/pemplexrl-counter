<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>pemplexrl Live Count</title>

  <!-- Livecounts-style odometer engine/theme -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/themes/odometer-theme-default.min.css" />

  <style>
    :root { --number-size: clamp(76px, 22vw, 250px); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
    body { font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
    .stage { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff; }

    #counter.odometer {
      color: #000;
      font-family: Arial, Helvetica, sans-serif !important;
      font-size: var(--number-size);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.045em;
      font-variant-numeric: tabular-nums lining-nums;
      white-space: nowrap;
      user-select: none;
    }

    #counter.odometer .odometer-inside,
    #counter.odometer .odometer-digit,
    #counter.odometer .odometer-digit-spacer,
    #counter.odometer .odometer-digit-inner,
    #counter.odometer .odometer-ribbon,
    #counter.odometer .odometer-ribbon-inner,
    #counter.odometer .odometer-value,
    #counter.odometer .odometer-formatting-mark {
      font-family: Arial, Helvetica, sans-serif !important;
      font-weight: 700;
    }

    /* Odometer's official wheel animation is 2 seconds. Keep both directions identical. */
    #counter.odometer.odometer-animating-up .odometer-ribbon-inner,
    #counter.odometer.odometer-animating-down .odometer-ribbon-inner {
      transition-duration: 2s !important;
      -webkit-transition-duration: 2s !important;
    }

    @media (max-aspect-ratio: 3/4) {
      :root { --number-size: clamp(70px, 21vw, 170px); }
    }
  </style>

  <script>
    window.odometerOptions = {
      auto: false,
      duration: 2000,
      format: '(,ddd)',
      theme: 'default',
      animation: 'slide'
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/odometer.min.js"></script>
</head>
<body>
  <main class="stage">
    <div id="counter" class="odometer odometer-theme-default" aria-label="TikTok follower count" aria-live="polite">0</div>
  </main>

  <script>
    const USERNAME = 'pemplexrl';
    const REFRESH_MS = 1500;
    const counterEl = document.getElementById('counter');
    let odometer = null;
    let currentCount = null;
    let fetching = false;

    function ensureOdometer(initialValue) {
      if (odometer) return odometer;
      odometer = new Odometer({
        el: counterEl,
        value: initialValue,
        duration: 2000,
        format: '(,ddd)',
        theme: 'default',
        animation: 'slide'
      });
      return odometer;
    }

    function updateCount(value) {
      const next = Math.max(0, Math.floor(Number(value)));
      if (!Number.isFinite(next)) return;

      if (currentCount === null) {
        currentCount = next;
        ensureOdometer(next);
        return;
      }

      if (next === currentCount) return;
      currentCount = next;

      // This is the same interaction model used by Livecounts: update the
      // odometer's numeric value and let the wheel engine roll the digits.
      ensureOdometer(next).update(next);
    }

    async function refresh() {
      if (fetching) return;
      fetching = true;
      try {
        const response = await fetch(`/api/count?user=${encodeURIComponent(USERNAME)}&t=${Date.now()}`, {
          cache: 'no-store'
        });
        if (!response.ok) throw new Error(`Counter API ${response.status}`);
        const data = await response.json();
        updateCount(data.followerCount);
      } catch (error) {
        console.error(error);
      } finally {
        fetching = false;
      }
    }

    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
