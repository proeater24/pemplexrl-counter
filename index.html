<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>pemplexrl Live Count</title>
  <style>
    :root {
      --roll-time: 560ms;
      --number-size: clamp(76px, 22vw, 250px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    /* Speed-style counter: nothing except the black number on white. */
    .counter {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 1em;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: var(--number-size);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.045em;
      font-variant-numeric: tabular-nums lining-nums;
      white-space: nowrap;
      user-select: none;
    }

    .digit {
      position: relative;
      display: inline-block;
      width: 0.585em;
      height: 1em;
      overflow: hidden;
      vertical-align: top;
    }

    .track {
      position: absolute;
      inset: 0 0 auto 0;
      width: 100%;
      height: 2em;
      transform: translateY(0);
      will-change: transform;
    }

    .value {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 1em;
    }

    .digit.up .track {
      animation: rollUp var(--roll-time) cubic-bezier(.16,.78,.22,1) both;
    }

    .digit.down .track {
      transform: translateY(-1em);
      animation: rollDown var(--roll-time) cubic-bezier(.16,.78,.22,1) both;
    }

    @keyframes rollUp {
      from { transform: translateY(0); }
      to { transform: translateY(-1em); }
    }

    @keyframes rollDown {
      from { transform: translateY(-1em); }
      to { transform: translateY(0); }
    }

    .comma {
      display: inline-flex;
      width: 0.29em;
      height: 1em;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 0.055em;
      margin-left: -0.02em;
      margin-right: 0.02em;
    }

    @media (max-aspect-ratio: 3/4) {
      :root { --number-size: clamp(70px, 21vw, 170px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .digit.up .track,
      .digit.down .track { animation-duration: 1ms; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div id="counter" class="counter" aria-label="TikTok follower count" aria-live="polite">—</div>
  </main>

  <script>
    const USERNAME = "pemplexrl";
    const REFRESH_MS = 5000;
    const counter = document.getElementById("counter");

    let currentCount = null;
    let fetching = false;
    let animationToken = 0;

    const format = value => Math.max(0, Math.floor(Number(value) || 0)).toLocaleString("en-GB");

    function renderStatic(value) {
      const text = format(value);
      counter.innerHTML = "";

      for (const char of text) {
        if (char === ",") {
          const comma = document.createElement("span");
          comma.className = "comma";
          comma.textContent = ",";
          counter.appendChild(comma);
          continue;
        }

        const digit = document.createElement("span");
        digit.className = "digit";
        const track = document.createElement("span");
        track.className = "track";
        const a = document.createElement("span");
        const b = document.createElement("span");
        a.className = b.className = "value";
        a.textContent = b.textContent = char;
        track.append(a, b);
        digit.appendChild(track);
        counter.appendChild(digit);
      }
    }

    function rollTo(nextValue) {
      const next = Math.max(0, Math.floor(Number(nextValue)));
      if (!Number.isFinite(next)) return;

      if (currentCount === null) {
        currentCount = next;
        renderStatic(next);
        return;
      }

      if (next === currentCount) return;

      const oldValue = currentCount;
      const oldText = format(oldValue);
      const nextText = format(next);
      const goingUp = next > oldValue;
      currentCount = next;

      if (oldText.length !== nextText.length) {
        renderStatic(next);
        counter.animate(
          [
            { transform: `translateY(${goingUp ? ".12em" : "-.12em"})`, opacity: .35 },
            { transform: "translateY(0)", opacity: 1 }
          ],
          { duration: 500, easing: "cubic-bezier(.16,.78,.22,1)" }
        );
        return;
      }

      counter.innerHTML = "";
      const oldChars = [...oldText];
      const nextChars = [...nextText];
      const token = ++animationToken;

      nextChars.forEach((newChar, index) => {
        const oldChar = oldChars[index];

        if (newChar === ",") {
          const comma = document.createElement("span");
          comma.className = "comma";
          comma.textContent = ",";
          counter.appendChild(comma);
          return;
        }

        const digit = document.createElement("span");
        digit.className = "digit";
        const track = document.createElement("span");
        track.className = "track";
        const first = document.createElement("span");
        const second = document.createElement("span");
        first.className = second.className = "value";

        if (newChar !== oldChar) {
          if (goingUp) {
            first.textContent = oldChar;
            second.textContent = newChar;
            digit.classList.add("up");
          } else {
            first.textContent = newChar;
            second.textContent = oldChar;
            digit.classList.add("down");
          }
        } else {
          first.textContent = second.textContent = newChar;
        }

        track.append(first, second);
        digit.appendChild(track);
        counter.appendChild(digit);
      });

      setTimeout(() => {
        if (token === animationToken) renderStatic(currentCount);
      }, 610);
    }

    async function getFollowerCount() {
      // Main route keeps the third-party request off the browser source.
      const response = await fetch(`/api/count?user=${encodeURIComponent(USERNAME)}&t=${Date.now()}`, {
        cache: "no-store"
      });
      if (!response.ok) throw new Error(`Counter API ${response.status}`);
      const data = await response.json();
      const count = Number(data.followerCount);
      if (!Number.isFinite(count)) throw new Error("Follower count missing");
      return count;
    }

    async function refresh() {
      if (fetching) return;
      fetching = true;
      try {
        rollTo(await getFollowerCount());
      } catch (error) {
        console.error(error);
        // Keep the last valid number onscreen instead of showing an error on stream.
      } finally {
        fetching = false;
      }
    }

    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
